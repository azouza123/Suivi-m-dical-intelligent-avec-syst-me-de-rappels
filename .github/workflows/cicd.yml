name: MediTrack CI/CD Pipeline

on:
  push:
    branches: [ main, master, frontend ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ─── Job 1: Test Backend ──────────────────────────────────────
  test-backend:
    name: Test Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Run backend tests
        working-directory: ./suivi-medical
        run: mvn test

  # ─── Job 2: Test Frontend ─────────────────────────────────────
  test-frontend:
    name: Test React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./medical-app/package-lock.json

      - name: Install dependencies
        working-directory: ./medical-app
        run: npm install

      - name: Build frontend
        working-directory: ./medical-app
        run: npm run build

  # ─── Job 3: Build & Push Docker Images ───────────────────────
  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./suivi-medical
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/meditrack-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./medical-app
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/meditrack-frontend:latest

  # ─── Job 4: Deploy ────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/meditrack
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f
            echo "✅ MediTrack deployed successfully!"