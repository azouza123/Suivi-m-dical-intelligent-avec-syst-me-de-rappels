# This file is used when running inside Docker
# Environment variables override these values via docker-compose.yml

server.port=8081

# MySQL - uses Docker service name 'mysql' as host
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/suivi_medical_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:meditrack}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:meditrack123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# MongoDB - uses Docker service name 'mongodb' as host
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/suivi_medical_chat}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:suivi_medical_chat}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB