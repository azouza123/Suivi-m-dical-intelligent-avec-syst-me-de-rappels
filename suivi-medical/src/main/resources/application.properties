server.port=8081

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/suivi_medical_db
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Thymeleaf (disable since we use React)
spring.thymeleaf.check-template-location=false

# JWT
app.jwt.secret=mySecretKey1234567890abcdefghijklmnopqrstuvwxyz
app.jwt.expiration=86400000

spring.data.mongodb.uri=mongodb://localhost:27017/suivi_medical_chat
spring.data.mongodb.database=suivi_medical_chat