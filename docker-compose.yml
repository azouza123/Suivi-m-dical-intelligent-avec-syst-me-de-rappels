version: '3.8'

services:

  # ─── Container 1: MySQL Database ─────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: meditrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: suivi_medical_db
      MYSQL_USER: meditrack
      MYSQL_PASSWORD: meditrack123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - meditrack-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ─── Container 2: MongoDB ─────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: meditrack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - meditrack-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      timeout: 10s
      retries: 5

  # ─── Container 3: Spring Boot Backend ────────────────────────
  backend:
    build:
      context: ./suivi-medical
      dockerfile: Dockerfile
    container_name: meditrack-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/suivi_medical_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: meditrack
      SPRING_DATASOURCE_PASSWORD: meditrack123
      # MongoDB
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/suivi_medical_chat
      SPRING_DATA_MONGODB_DATABASE: suivi_medical_chat
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - meditrack-network

  # ─── Container 4: React Frontend ─────────────────────────────
  frontend:
    build:
      context: ./medical-app
      dockerfile: Dockerfile
    container_name: meditrack-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - meditrack-network

# ─── Volumes ──────────────────────────────────────────────────
volumes:
  mysql_data:
  mongo_data:
  uploads_data:

# ─── Network ──────────────────────────────────────────────────
networks:
  meditrack-network:
    driver: bridge